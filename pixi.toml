[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]
preview = ["pixi-build"]

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
hatchling = "*"

[dependencies]
python = ">=3.14.8,<3.16"
#python = ">=3.15.0,<3.16"
geopandas = ">=1.2.0,<2"
matplotlib = ">=3.11.2,<4"
xmltodict = ">=1.0.4,<2"

[pypi-dependencies]
footbridge = { path = ".", editable = true }

[environments]
default = { features = ["default"], solve-group = "default" }
dev = { features = ["dev", "docs"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }

[feature.dev.dependencies]
duckdb = ">=1.5.6,<2"
pandas-stubs = ">=3.0.5.260914,<4"
pixi-pycharm = ">=0.0.12,<0.0.13"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
ruff = ">=0.17.0,<0.18"
sedonadb = ">=0.5.0,<0.6"
ty = ">=0.0.87,<0.0.88"
types-shapely = ">=2.1.0.20260402,<3"

[feature.dev.tasks]
coverage = "pytest -n auto --cov=footbridge --cov-report=json:docs/pytest_coverage.json --cov-report=term-missing"
lint = { depends-on = ["lint-ruff", "lint-ty"] }
lint-ruff = "ruff format ./src ./tests"
lint-ty = "ty check ./src ./tests"
test = "pytest -n auto ./tests"

[feature.docs]
# dependencies should match docs/requirements.txt
dependencies = { jupyter = ">=1.1.1,<2", myst-parser = ">=5.1.0,<6", nbsphinx = ">=0.9.8,<0.10", notebook = ">=7.6.3,<8", pydata-sphinx-theme = ">=0.23.0,<0.24", sphinx = ">=9.1.0,<10", sphinx-copybutton = ">=0.5.2,<0.6" }
tasks = { docs = "./docs/make html" }
target = { win-64 = { tasks = { docs = "./docs/make.bat html" } } }
