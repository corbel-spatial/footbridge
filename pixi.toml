[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]
preview = ["pixi-build"]

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
hatchling = "*"

[dependencies]
gdal = ">=3.13.3,<4"
geopandas = ">=1.2.0,<2"
matplotlib = ">=3.11.2,<4"
xmltodict = ">=1.0.4,<2"

[pypi-dependencies]
footbridge = { path = ".", editable = true }

[environments]
demo = { features = ["demo"], no-default-feature = true }

[environments.dev.dependencies]
python = ">=3.15.1,<3.16"
pandas-stubs = ">=3.0.5.260914,<4"
pixi-pycharm = ">=0.0.12,<0.0.13"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
ruff = ">=0.17.2,<0.18"
scipy-stubs = ">=1.18.1.1,<2"
ty = ">=0.0.91,<0.0.92"
types-geopandas = ">=1.1.4.20261006,<2"
types-shapely = ">=2.1.0.20260402,<3"
types-xmltodict = ">=1.0.1.20250920,<2"

[environments.dev.tasks]
coverage = "pytest -n auto --cov=footbridge --cov-report=json:docs/pytest_coverage.json --cov-report=term-missing"
lint = { depends-on = ["lint-ruff", "lint-ty"] }
lint-ruff = "ruff format ./src ./tests"
lint-ty = "ty check ./src ./tests"
test = { cmd = "pytest -n auto ./tests", depends-on = ["lint"] }

[environments.dev.target.win-64.tasks]
lint-ty = { cmd = "ty check ./src ./tests --extra-search-path .pixi/envs/dev/lib/python/site-packages", depends-on = ["setup-ty"] }
setup-ty = """
python -c "import os, pathlib; p = pathlib.Path(os.environ['APPDATA']) / 'ty' / 'ty.toml'; (p.parent.mkdir(parents=True, exist_ok=True), p.write_text('[environment]\\nextra-paths = [\\".pixi/envs/dev/lib/python/site-packages\\"]\\n'), print('Created ' + str(p))) if not p.exists() else print('ty.toml already exists; skipping.')"
"""

[environments.docs.dependencies]
python = ">=3.15.1,<3.16"
# build deps should match docs/requirements.txt
jupyter = ">=1.1.1,<2"
myst-parser = ">=5.1.0,<6"
nbsphinx = ">=0.9.8,<0.10"
notebook = ">=7.6.3,<8"
pydata-sphinx-theme = ">=0.23.0,<0.24"
sphinx = ">=9.2.0,<10"
sphinx-copybutton = ">=0.5.2,<0.6"

[environments.docs.tasks]
docs = "make -C ./docs html"

[environments.docs.target.win-64.tasks]
docs = "./docs/make.bat html"

[feature.demo]
platforms = ["win-64"]
channels = ["esri", "main"]
dependencies = {
    python = ">=3.13.16,<3.14",
    arcpy = ">=3.7,<3.8",
    gdal = ">=3.13.2,<4"
}
pypi-dependencies = {
    footbridge = { path = ".", editable = true }
}
tasks = {
    demo = "jupyter lab --notebook-dir=./docs/notebooks",
    demo-headless = "jupyter nbconvert --to notebook --execute --inplace docs/notebooks/*.ipynb"
}
