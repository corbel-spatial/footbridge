name: Pytest - macOS

on:
  workflow_dispatch:
  pull_request:
    paths: [ "src/**", "tests/**" ]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest

    strategy:
      fail-fast: true
      matrix:
        environment: [ py311, py312, py313, py314, py315 ]

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/pixi.lock
            .github/pixi.toml
            pyproject.toml
            README.md
            src
            tests
          sparse-checkout-cone-mode: false

      - run: brew install proj

      # https://github.com/marketplace/actions/setup-pixi
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          environments: ${{ matrix.environment }}
          manifest-path: .github/pixi.toml
          activate-environment: true
          locked: false
          frozen: true
      - run: pytest tests
