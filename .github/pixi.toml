[workspace]
channels = ["conda-forge", "conda-forge/label/python_rc"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
pytest = ">=9.1.1,<10"
pytest-xdist = ">=3.8.0,<4"
# these should match pyproject.toml
gdal = ">=3.13.3,<4"
geopandas = ">=1.2.0,<2"
matplotlib = ">=3.11.2,<4"
xmltodict = ">=1.0.4,<2"

[tasks]
test = "pytest ../tests"

[pypi-dependencies]
footbridge = { path = "..", editable = false }

[environments.py311.dependencies]
python = ">=3.11.17,<3.12"

[environments.py312.dependencies]
python = ">=3.12.15,<3.13"

[environments.py313.dependencies]
python = ">=3.13.17,<3.14"

[environments.py314.dependencies]
python = ">=3.14.9,<3.15"

[environments.py315.dependencies]
python = ">=3.15.1,<3.16"
