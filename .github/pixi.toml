[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
pytest = ">=9.1.1,<10"
pytest-xdist = ">=3.8.0,<4"

gdal = ">=3.13.3,<4"
geopandas = ">=1.2.0,<2"
matplotlib = ">=3.11.2,<4"
xmltodict = ">=1.0.4,<2"

[pypi-dependencies]
footbridge = { path = "..", editable = false }

[environments.py311]
dependencies = { python = ">=3.11.18,<3.12" }
constraints = { python = ">=3.11,<3.12" }

[environments.py312]
dependencies = { python = ">=3.12.16,<3.13" }
constraints = { python = ">=3.12,<3.13" }

[environments.py313]
dependencies = { python = ">=3.13.18,<3.14" }
constraints = { python = ">=3.13,<3.14" }

[environments.py314]
dependencies = { python = ">=3.14.10,<3.15" }
constraints = { python = ">=3.14,<3.15" }

[environments.py315]
dependencies = { python = ">=3.15.2,<3.16" }
constraints = { python = ">=3.15,<3.16" }

[tasks]
test = "pytest ../tests"
